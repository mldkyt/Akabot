[project]
name = "akabot"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.18.4",
    "py-cord[speed]>=2.8.0",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.51",
    "psycopg2>=2.9.12",
    "requests>=2.34.2",
    "dateparser>=1.4.1",
    "flask>=3.1.3",
    "gunicorn>=26.0.0",
    "mdparser-html==2.0.2",
    "markovify>=0.9.4",
]

[tool.basedpyright]
reportOptionalMemberAccess = "warning"
reportArgumentType = "warning"
reportAny = "none"
reportUnusedCallResult = "none"
