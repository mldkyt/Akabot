{% extends 'page.html' %}

{% block main %}
<h1>Akabot settings</h1>
<p>Welcome to Akabot settings! On the left you can choose the features of Akabot and configure them.</p>

{% for flash in get_flashed_messages() %}
<div class="flash">
    <p>{{flash}}</p>
</div>
{% endfor %}

<h2>Quick settings</h2>
<form method="post">
    <label for="botchannel">Bot channel</label>
    <select id="botchannel" name="botchannel">
        <option value="unset">-- Unset --</option>
        {% for text_channel in text_channels %}
        <option value="{{text_channel.id}}" {% if text_channel.id == current_bot_channel %}selected{% endif %}>
            {{text_channel.name}}
        </option>
        {% endfor %}
    </select>
    <br>
    <label for="adminbotchannel">Admin bot channel</label>
    <select id="adminbotchannel" name="adminbotchannel">
        <option value="unset">-- Unset --</option>
        {% for text_channel in text_channels %}
        <option value="{{text_channel.id}}" {% if text_channel.id == current_admin_bot_channel %}selected{% endif %}>
            {{text_channel.name}}
        </option>
        {% endfor %}
    </select>
    <br>

    <!-- Response setting -->
    <label for="response">Bot response setting</label>
    <select id="response" name="response">
        <option value="on" {% if response == "on" %}selected{% endif %}>enable</option>
        <option value="bot" {% if response == "bot" %}selected{% endif %}>only use bot channel (with ping)</option>
        <option value="bot_noping" {% if response == "bot_noping" %}selected{% endif %}>only use bot channel (do not ping)</option>
        <option value="off" {% if response == "off" %}selected{% endif %}>disable</option>
    </select>
    <br>

    <!-- Response deletion delay -->
    <label for="responsedelete">Response delete delay</label>
    <input type="number" id="responsedelete" name="responsedelete" value="{{response_delete_delay}}">
    <br>

    <button type="submit">Save</button>
</form>

{% endblock %}
