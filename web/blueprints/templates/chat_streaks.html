{% extends 'page.html' %}
{% from '_components.html' import page_header %}{% block main %}
{{ page_header('Chat Streaks', 'Require members to send a minimum amount of messages each day before their streak counts.') }}

<section class="settings-panel">
    <form action="/settings/chat_streaks" method="post">
        <div class="check-row">
            <input type="checkbox" id="streakminimumenable" name="streakminimumenable" {% if minimum_enabled == "true" %}checked{% endif %}>
            <label for="streakminimumenable">Enable minimum message requirement</label>
        </div>

        <label for="streakminimum">Minimum messages per day</label>
        <input type="number" id="streakminimum" name="streakminimum" min="1" value="{{minimum_messages}}">

        <div class="check-row">
            <input type="checkbox" id="streaksamemember" name="streaksamemember" {% if same_member_check == "true" %}checked{% endif %}>
            <label for="streaksamemember">Count the same member sending multiple messages as one message</label>
        </div>

        <div class="form-actions">
            <button type="submit">Save settings</button>
        </div>
    </form>
</section>
{% endblock %}
