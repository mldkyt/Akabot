{% extends 'page.html' %}
{% from '_components.html' import page_header %}{% block main %}
{{ page_header('Fun Commands', 'Enable or disable the fun commands that fit your server.') }}

<section class="settings-panel">
    <form method="post" action="/settings/fun">
        <div class="check-row">
            <input type="checkbox" name="rp" id="rp" {% if rp %}checked{% endif %}>
            <label for="rp">Enable the RP commands</label>
        </div>

        <div class="form-actions">
            <button type="submit">Save settings</button>
        </div>
    </form>
</section>
{% endblock %}
