{% extends 'page.html' %}

{% block main %}
<h1>Fun commands</h1>
<p>Here you can enable and disable the fun commands.</p>

{% for flash in get_flashed_messages() %}
<div class="flash">
    <p>{{flash}}</p>
</div>
{% endfor %}

<form method="post" action="/settings/fun">
    <input type="checkbox" name="yuri" id="yuri" {% if yuri %}checked{% endif %}>
    <label for="yuri">Enable the yuri command</label>
    <br>

    <input type="checkbox" name="yaoi" id="yaoi" {% if yaoi %}checked{% endif %}>
    <label for="yaoi">Enable the yaoi command</label>
    <br>

    <input type="checkbox" name="rp" id="rp" {% if rp %}checked{% endif %}>
    <label for="rp">Enable the RP commands</label>
    <br>

    <button type="submit">Save</button>
</form>

{% endblock %}
