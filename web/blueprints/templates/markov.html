{% extends 'page.html' %} {% block main %}
<h1>Markov Chains</h1>

<form action="/settings/markov" method="post">
    <label for="channel">Channel</label>
    <select name="channel" id="channel">
        {% for text_channel in text_channels %}
        <option value="{{text_channel.id}}">{{text_channel.name}}</option>
        {% endfor %}
    </select>
    <br />
    <label for="mode">Mode</label>
    <select id="mode" name="mode">
        <option value="periodic">Periodic</option>
        <option value="messages">After x messages</option>
        <option value="command">Using /markov</option>
    </select>
    <br />
    <label for="num_periods">Every</label>
    <input type="number" name="num_periods" id="num_periods" min="1" value="1" />
    <select name="period" id="period">
        <option value="minutely">minutes</option>
        <option value="hourly">hours</option>
        <option value="daily">days</option>
    </select>
    <br />
    <label for="messages">Messages count</label>
    <input type="number" id="messages" name="messages_num">
    <br />
    <button type="submit">Save</button>
</form>

{% for channel in enabled_channels %}
<h2>Channel: #{{channel.name}}</h2>
<form action="/settings/markov" method="post">
    <input type="hidden" name="channel" value="{{channel.id}}" />
    <label for="mode{{channel.id}}">Mode</label>
    <select id="mode{{channel.id}}" name="mode">
        <option value="periodic" {% if channel.mode == 'periodic' %}selected{% endif %}>Periodic</option>
        <option value="messages" {% if channel.mode == 'messages' %}selected{% endif %}>After x messages</option>
        <option value="command" {% if channel.mode == 'command' %}selected{% endif %}>Using /markov</option>
    </select>
    <br />
    <label for="num_periods{{channel.id}}">Every</label>
    <input type="number" name="num_periods" id="num_periods{{channel.id}}" min="1" value="{{channel.period_num}}" />
    <select name="period" id="period{{channel.id}}">
        <option value="minutely" {% if channel.period == 'minutely' %}selected{% endif %}>minutes</option>
        <option value="hourly" {% if channel.period == 'hourly' %}selected{% endif %}>hours</option>
        <option value="daily" {% if channel.period == 'daily' %}selected{% endif %}>days</option>
    </select>
    <br />
    <label for="messages{{channel.id}}">Messages count</label>
    <input type="number" id="messages{{channel.id}}" name="messages_num" value="{{channel.messages_num}}">
    <br />
    <button type="submit">Update</button>
</form>
<form action="/settings/markov" method="post">
    <input type="hidden" name="delete" value="{{channel.id}}" />
    <button type="submit">Disable</button>
</form>
{% endfor %}

{% endblock %}
