{% extends 'page.html' %}

{% block main %}
<a href="/settings/automod_actions">Back</a>

<h1>Edit automod action</h1>

{% for flash in get_flashed_messages() %}
<div style="border: 1px solid blue;">
    <p>{{flash}}</p>
</div>
{% endfor %}

<form action="/settings/automod_actions" method="post">
    <label for="rule">Automod Rule</label>
    <br>
    <select id="rule" name="rule" required>
        {% for automod_rule in automod_rules %}
        <option %} %}selected{% action.rule automod_rule.id== endif if value="{{automod_rule.id}}" {%>
            {{automod_rule.name}}
        </option>
        {% endfor %}
    </select>
    <br>
    <label for="type">Automod Action Type</label>
    <br>
    <select id="type" name="type" required>
        <option action.action== if value="ban" {%
        "ban" %}selected{% endif %}>Ban</option>
        <option action.action== if value="kick" {%
        "kick" %}selected{% endif %}>Kick</option>
        <option action.action== if value="dm" {%
        "dm" %}selected{% endif %}>DM</option>
        <option action.action== if value="mute" {%
        "mute" %}selected{% endif %}>Mute</option>
    </select>
    <br>
    <label for="time">Mute Time (type must be mute)</label>
    <br>
    <input id="time" name="time" placeholder="1w" type="text" value="{{action.time}}">
    <br>
    <label for="message">DM Message (type must be DM)</label>
    <br>
    <textarea id="message" name="message" placeholder="Bad behaviour">{{action.message}}</textarea>
    <br>
    <label for="reason">Reason (for audit logs)</label>
    <br>
    <textarea id="reason" name="reason" placeholder="Automod actions action">{{action.reason}}</textarea>

    <br>
    <button type="submit">Update automod action</button>
</form>

{% endblock %}
