<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit mail</title>
</head>
<body>
<h1>Edit mail post</h1>

<form action="/admin/mail/edit/{{item[0]}}" method="post">
    <label for="author">Author: </label>
    <br>
    <input id="author" name="author" type="text" value="{{item[2]}}">
    <br>
    <br>
    <label for="post">Post (Markdown is supported)</label>
    <br>
    <textarea id="post" name="post">{{item[1]}}</textarea>
    <br>
    <br>
    <button type="submit">Edit post</button>
</form>
</body>
</html>
