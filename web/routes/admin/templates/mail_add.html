<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add new mail</title>
</head>
<body>
<h1>Add new mail post</h1>

{% if error %}
<p>An error occurred: {{error}}</p>
{% endif %}

<form action="/admin/mail/add" method="post">
    <label for="author">Author: </label>
    <br>
    <input id="author" name="author" type="text">
    <br>
    <br>
    <label for="post">Post (Markdown is supported)</label>
    <br>
    <textarea id="post" name="post"></textarea>
    <br>
    <br>
    <button type="submit">Create mail post</button>
</form>
</body>
</html>
