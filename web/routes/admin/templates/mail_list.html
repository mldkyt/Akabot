<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>List of mail</title>
</head>
<body>
<h1>List of mail</h1>
<a href="/admin/mail/add">Add a new mail</a>
<br>

<table>
    <thead>
    <tr>
        <th>Author</th>
        <th>Content</th>
        <th>Created At</th>
        <th>Last update</th>
        <th>Actions and consequences</th>
    </tr>
    </thead>
    <tbody>
    {% for i in mail %}
    <tr>
        <td>{{i[1]}}</td>
        <td>{{i[2]}}</td>
        <td>{{i[3]}}</td>
        <td>{{i[4]}}</td>
        <td>
            <a href="/admin/mail/edit/{{i[0]}}">Edit</a>
            <a href="/admin/mail/delete/{{i[0]}}">Delete</a>
        </td>
    </tr>
    {% endfor %}
    </tbody>
</table>
</body>
</html>
